<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="sps.css">
</head>

<body>
    <header>
        <h1>Rock Paper Scissors</h1>
    </header>

    <div class="the-whole-game">
        <div class="pics">
            <button class="choice" id="rock">
                <img src="images/stone.jpg" alt="Rock">
            </button>
            <button class="choice" id="paper">
                <img src="images/paper.jpg" alt="Paper">
            </button>
            <button class="choice" id="scissor">
                <img src="images/scissor.jpg" alt="Scissor">
            </button>
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play Your Move.</p>
    </div>

    <button id="rst-btn">Reset Game</button>

    <script src="sps.js"></script>
</body>
</html>
